<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Full-bleed royal blue gradient matching styles.css (#3b82f6 -> #2563eb -> #1d4ed8) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle top-left radial glow for depth -->
    <radialGradient id="bgGlow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp white gift box gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2f9" />
    </linearGradient>

    <!-- Warm golden-amber ribbon gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Slightly deeper amber for bow underside / knot depth -->
    <linearGradient id="ribbonDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft drop shadow for the gift box -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.26" />
    </filter>

    <!-- Subtle shadow under the lid -->
    <filter id="lidShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Full-bleed edge-to-edge background (safe for Android adaptive masks & desktop icons) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGlow)" />

  <!-- Gift box emblem centered inside Android safe zone -->
  <g transform="translate(512 518) scale(1.16) translate(-512 -512)" filter="url(#softShadow)">
    <!-- Ribbon Bow Loops (behind knot, resting on top of lid) -->
    <path
      d="M 504 390 C 464 274, 360 264, 352 332 C 345 384, 424 394, 504 390 Z"
      fill="none"
      stroke="url(#ribbonGrad)"
      stroke-width="44"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path
      d="M 520 390 C 560 274, 664 264, 672 332 C 679 384, 600 394, 520 390 Z"
      fill="none"
      stroke="url(#ribbonGrad)"
      stroke-width="44"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Gift Box Body (square top tucked under lid, rounded bottom corners) -->
    <path
      d="M 306 480 H 718 V 716 A 40 40 0 0 1 678 756 H 346 A 40 40 0 0 1 306 716 Z"
      fill="url(#boxGrad)"
    />

    <!-- Horizontal Ribbon Accent on Body -->
    <rect x="306" y="590" width="412" height="62" fill="url(#ribbonGrad)" opacity="0.92" />
    <!-- Vertical Ribbon on Body -->
    <rect x="470" y="480" width="84" height="276" fill="url(#ribbonGrad)" />

    <!-- Subtle shadow cast by lid onto box body -->
    <rect x="306" y="486" width="412" height="22" fill="#1e293b" opacity="0.11" />

    <!-- Gift Box Lid -->
    <g filter="url(#lidShadow)">
      <rect x="276" y="388" width="472" height="108" rx="30" fill="#ffffff" />
      <!-- Vertical Ribbon across Lid -->
      <rect x="470" y="388" width="84" height="108" fill="url(#ribbonGrad)" />
    </g>

    <!-- Center Bow Knot -->
    <rect x="466" y="352" width="92" height="58" rx="26" fill="url(#ribbonDark)" />
    <rect x="474" y="358" width="76" height="24" rx="12" fill="#fef08a" opacity="0.45" />
  </g>
</svg>
